<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-purple-800 p-6 flex flex-col space-y-6">
            <h2 class="text-xl font-bold">Dashboard</h2>
            <nav>
                <ul class="space-y-4">
                    <li><a href="#overview" class="block py-2 px-4 bg-purple-700 rounded">Overview</a></li>
                    <li><a href="#analytics" class="block py-2 px-4 hover:bg-purple-700 rounded">Analytics</a></li>
                    <li><a href="#reports" class="block py-2 px-4 hover:bg-purple-700 rounded">Reports</a></li>
                    <li><a href="#settings" class="block py-2 px-4 hover:bg-purple-700 rounded">Settings</a></li>
                </ul>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 p-6">
            <header class="mb-6 flex justify-between items-center">
                <h1 class="text-3xl font-semibold">Welcome, User</h1>
                <button class="bg-purple-600 px-4 py-2 rounded-lg">Logout</button>
            </header>
            
            <!-- Overview Section -->
            <section id="overview" class="grid grid-cols-3 gap-6">
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h3 class="text-xl font-semibold">Total Users</h3>
                    <p class="text-3xl font-bold">1,250</p>
                </div>
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h3 class="text-xl font-semibold">Revenue</h3>
                    <p class="text-3xl font-bold">$45,000</p>
                </div>
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <h3 class="text-xl font-semibold">New Signups</h3>
                    <p class="text-3xl font-bold">350</p>
                </div>
            </section>
            
            <!-- Recent Activity Section -->
            <section id="analytics" class="mt-10">
                <h2 class="text-2xl font-semibold mb-4">Recent Activity</h2>
                <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                    <p class="text-gray-300">User <span class="font-bold">John Doe</span> made a purchase.</p>
                    <p class="text-gray-300">User <span class="font-bold">Jane Smith</span> signed up.</p>
                    <p class="text-gray-300">System update completed.</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
